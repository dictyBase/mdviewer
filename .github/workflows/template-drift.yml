name: Template drift

on:
  pull_request:

jobs:
  templ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - run: git diff --exit-code -- templates_templ.go
