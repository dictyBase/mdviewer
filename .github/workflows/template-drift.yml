name: Template drift

on:
  pull_request:

jobs:
  templ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate -path internal/viewer
      - run: git diff --exit-code -- internal/viewer/templates_templ.go